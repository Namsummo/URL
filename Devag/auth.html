<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store - Đăng Nhập/Đăng Ký</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <h1>Fashion Store</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="products.html">Sản Phẩm</a></li>
            <li><a href="promotions.html">Khuyến Mãi</a></li>
            <li><a href="cart.html">Giỏ Hàng</a></li>
            <li><a href="contact.html">Liên Hệ</a></li>
        </ul>
    </nav>

    </head>

    <body>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>Fashion Store</h1>
                    <p>Đăng nhập để trải nghiệm mua sắm tuyệt vời</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Đăng Nhập</button>
                    <button class="auth-tab" data-tab="register">Đăng Ký</button>
                </div>

                <!-- Form Đăng Nhập -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Mật Khẩu</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            Ghi nhớ đăng nhập
                        </label>
                        <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="auth-btn">Đăng Nhập</button>
                </form>

                <!-- Form Đăng Ký -->
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="registerName">Họ và Tên</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPhone">Số Điện Thoại</label>
                        <input type="tel" id="registerPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Mật Khẩu</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Xác Nhận Mật Khẩu</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            Tôi đồng ý với <a href="#">Điều khoản sử dụng</a>
                        </label>
                    </div>
                    <button type="submit" class="auth-btn">Đăng Ký</button>
                </form>

                <div class="social-login">
                    <p>Hoặc đăng nhập với</p>
                    <div class="social-buttons">
                        <button class="social-btn facebook">
                            <i class="fab fa-facebook-f"></i>
                            Facebook
                        </button>
                        <button class="social-btn google">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <script src="script.js"></script>
    </body>

</html>
