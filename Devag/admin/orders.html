<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Fashion Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/middleware.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50, #1a252f);
            color: #fff;
            position: fixed;
            height: 100vh;
            transition: all 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.1);
        }

        .sidebar-header h2 {
            color: #fff;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-menu {
            padding: 30px 0;
        }

        .nav-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            color: #c2c7d0;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 5px 0;
            border-left: 4px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-left: 4px solid #ff6b6b;
            transform: translateX(5px);
        }

        .nav-item i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
            font-size: 1.1em;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 30px;
        }

        .top-bar {
            background: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff6b6b;
            padding: 2px;
        }

        /* Orders Table Styles */
        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .orders-header h2 {
            font-size: 1.8em;
            color: #333;
            font-weight: 600;
        }

        .orders-table {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table th, .table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .order-status {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 500;
            display: inline-block;
        }

        .status-processing {
            background: #fff3e0;
            color: #ff9800;
        }

        .status-shipping {
            background: #e3f2fd;
            color: #2196f3;
        }

        .status-delivered {
            background: #e8f5e9;
            color: #4caf50;
        }

        .status-cancelled {
            background: #ffebee;
            color: #f44336;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .view-btn, .update-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: white;
            transition: all 0.3s ease;
        }

        .view-btn {
            background: #4CAF50;
        }

        .view-btn:hover {
            background: #43A047;
        }

        .update-btn {
            background: #2196F3;
        }

        .update-btn:hover {
            background: #1E88E5;
        }

        /* Order Details Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: #fff;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 800px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }

        .order-details-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .order-details-header h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .customer-info, .shipping-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-weight: 500;
        }

        .order-items-list {
            margin: 20px 0;
        }

        .order-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .order-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .item-meta {
            color: #666;
            font-size: 0.9em;
        }

        .item-price {
            color: #ff6b6b;
            font-weight: 500;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .sidebar-header h2, .nav-item span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .status-update-form {
            padding: 20px;
        }

        .status-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-top: 10px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Search Form Styles */
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #2196F3;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.1);
            outline: none;
        }

        .search-btn {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #1E88E5;
            transform: translateY(-1px);
        }

        .search-btn i {
            font-size: 1.1em;
        }

        .clear-search {
            padding: 10px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .clear-search:hover {
            background: #555;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Fashion Store</h2>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="categories.html" class="nav-item">
                    <i class="fas fa-tags"></i>
                    <span>Quản lý danh mục</span>
                </a>
                <a href="products.html" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Quản lý sản phẩm</span>
                </a>
                <a href="orders.html" class="nav-item active">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Quản lý đơn hàng</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Quản lý tài khoản</span>
                </a>
                <a href="promotions.html" class="nav-item">
                    <i class="fas fa-percent"></i>
                    <span>Khuyến mãi</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Báo cáo, phản hồi</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Cài đặt</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="Admin">
                    <span>Administrator</span>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Đăng xuất
                </button>
            </div>

            <div class="orders-header">
                <h2>Quản lý đơn hàng</h2>
            </div>
            <div class="search-form">
                <input type="text" 
                       id="searchInput" 
                       class="search-input" 
                       placeholder="Tìm kiếm theo mã đơn hàng hoặc tên khách hàng..."
                       onkeyup="handleSearch(event)">
                <button class="search-btn" onclick="searchOrders()">
                    <i class="fas fa-search"></i>
                    Tìm kiếm
                </button>
                <button class="clear-search" onclick="clearSearch()">
                    <i class="fas fa-times"></i>
                    Xóa
                </button>
            </div>

            <div class="orders-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Mã đơn hàng</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Orders will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div id="orderDetailsContent">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra quyền admin
        document.addEventListener('DOMContentLoaded', function() {
            const adminUser = JSON.parse(localStorage.getItem('adminUser'));
            if (!adminUser || adminUser.role !== 'admin') {
                window.location.href = '../client/auth.html';
                return;
            }

            // Cập nhật thông tin admin
            const adminName = document.querySelector('.user-info span');
            if (adminName) {
                adminName.textContent = adminUser.name;
            }

            // Load đơn hàng
            loadOrders();
        });

        // Xử lý đăng xuất
        function logout() {
            localStorage.removeItem('adminUser');
            window.location.href = '../client/auth.html';
        }

        // Load danh sách đơn hàng
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            const tableBody = document.getElementById('ordersTableBody');
            
            // Sắp xếp đơn hàng theo thời gian mới nhất
            const sortedOrders = orders.sort((a, b) => {
                return new Date(b.orderDate) - new Date(a.orderDate);
            });
            
            tableBody.innerHTML = sortedOrders.map(order => {
                const orderDate = new Date(order.orderDate).toLocaleDateString('vi-VN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <tr>
                        <td>#${order.orderId}</td>
                        <td>${order.customerInfo.fullname}</td>
                        <td>${orderDate}</td>
                        <td>${formatPrice(order.total)}</td>
                        <td>
                            <span class="order-status status-${getStatusClass(order.status)}">
                                ${order.status}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="view-btn" onclick="viewOrderDetails('${order.orderId}')">
                                    <i class="fas fa-eye"></i> Chi tiết
                                </button>
                                <button class="update-btn" onclick="updateOrderStatus('${order.orderId}')">
                                    <i class="fas fa-edit"></i> Cập nhật
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Xem chi tiết đơn hàng
        function viewOrderDetails(orderId) {
            const orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            const order = orders.find(o => o.orderId === orderId);
            
            if (order) {
                const orderDate = new Date(order.orderDate).toLocaleDateString('vi-VN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const modalContent = document.getElementById('orderDetailsContent');
                modalContent.innerHTML = `
                    <div class="order-details-header">
                        <h3>Chi tiết đơn hàng #${order.orderId}</h3>
                        <p>Ngày đặt: ${orderDate}</p>
                    </div>

                    <div class="customer-info">
                        <h4 class="info-title">Thông tin khách hàng</h4>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Họ và tên</span>
                                <span class="info-value">${order.customerInfo.fullname}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Email</span>
                                <span class="info-value">${order.customerInfo.email}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Số điện thoại</span>
                                <span class="info-value">${order.customerInfo.phone}</span>
                            </div>
                        </div>
                    </div>

                    <div class="shipping-info">
                        <h4 class="info-title">Thông tin giao hàng</h4>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Địa chỉ</span>
                                <span class="info-value">${order.customerInfo.address}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Tỉnh/Thành phố</span>
                                <span class="info-value">${order.customerInfo.city}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Quận/Huyện</span>
                                <span class="info-value">${order.customerInfo.district}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Ghi chú</span>
                                <span class="info-value">${order.customerInfo.note || 'Không có'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="order-items-list">
                        <h4 class="info-title">Sản phẩm đặt mua</h4>
                        ${order.items.map(item => `
                            <div class="order-item">
                                <img src="${item.image}" alt="${item.name}">
                                <div class="item-details">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-meta">
                                        Size: ${item.size} | Số lượng: ${item.quantity}
                                    </div>
                                    <div class="item-price">${formatPrice(item.price)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="order-summary">
                        <div class="summary-row">
                            <span>Tổng tiền hàng:</span>
                            <span>${formatPrice(order.total - order.shippingFee)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Phí vận chuyển:</span>
                            <span>${formatPrice(order.shippingFee)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Tổng thanh toán:</span>
                            <span>${formatPrice(order.total)}</span>
                        </div>
                    </div>
                `;

                document.getElementById('orderModal').style.display = 'block';
            }
        }

        // Cập nhật trạng thái đơn hàng
        function updateOrderStatus(orderId) {
            const orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            const order = orders.find(o => o.orderId === orderId);
            
            if (order) {
                const statusOptions = [
                    'Đang xử lý',
                    'Đang giao hàng',
                    'Đã giao hàng'
                ];

                // Tạo modal cho việc cập nhật trạng thái
                const modalContent = document.getElementById('orderDetailsContent');
                modalContent.innerHTML = `
                    <div class="order-details-header">
                        <h3>Cập nhật trạng thái đơn hàng #${order.orderId}</h3>
                    </div>
                    <div class="status-update-form">
                        <div class="form-group">
                            <label>Chọn trạng thái mới:</label>
                            <select id="newStatus" class="status-select">
                                ${statusOptions.map(status => `
                                    <option value="${status}" ${order.status === status ? 'selected' : ''}>
                                        ${status}
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="form-actions">
                            <button class="cancel-btn" onclick="closeModal()">Hủy</button>
                            <button class="save-btn" onclick="saveOrderStatus('${order.orderId}')">
                                <i class="fas fa-save"></i> Lưu thay đổi
                            </button>
                        </div>
                    </div>
                `;

                // Hiển thị modal
                document.getElementById('orderModal').style.display = 'block';
            }
        }

        // Hàm lưu trạng thái mới
        function saveOrderStatus(orderId) {
            const orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            const clientOrders = JSON.parse(localStorage.getItem('orders')) || [];
            const order = orders.find(o => o.orderId === orderId);
            const newStatus = document.getElementById('newStatus').value;
            
            if (order && newStatus) {
                // Cập nhật trạng thái chính
                order.status = newStatus;
                
                const now = new Date();
                
                // Tạo timeline theo cấu trúc client
                const defaultTimeline = [
                    {
                        status: 'Đơn hàng đã đặt',
                        date: order.orderDate,
                        location: 'Hệ thống Fashion Store',
                        completed: true,
                        active: false
                    },
                    {
                        status: 'Đang xử lý',
                        date: null,
                        location: 'Kho hàng Fashion Store',
                        completed: false,
                        active: false
                    },
                    {
                        status: 'Đang giao hàng',
                        date: null,
                        location: 'Đơn vị vận chuyển',
                        completed: false,
                        active: false
                    },
                    {
                        status: 'Đã giao hàng',
                        date: null,
                        location: 'Địa chỉ người nhận',
                        completed: false,
                        active: false
                    }
                ];

                // Nếu chưa có timeline, tạo mới
                if (!order.timeline) {
                    order.timeline = defaultTimeline;
                }

                // Cập nhật trạng thái trong timeline
                order.timeline.forEach(step => {
                    switch(newStatus) {
                        case 'Đang xử lý':
                            if (step.status === 'Đang xử lý') {
                                step.date = now.toISOString();
                                step.completed = true;
                                step.active = true;
                            } else if (step.status === 'Đơn hàng đã đặt') {
                                step.completed = true;
                                step.active = false;
                            } else {
                                step.completed = false;
                                step.active = false;
                            }
                            break;
                        case 'Đang giao hàng':
                            if (step.status === 'Đang giao hàng') {
                                step.date = now.toISOString();
                                step.completed = true;
                                step.active = true;
                            } else if (step.status === 'Đơn hàng đã đặt' || step.status === 'Đang xử lý') {
                                step.completed = true;
                                step.active = false;
                                if (!step.date) step.date = now.toISOString();
                            } else {
                                step.completed = false;
                                step.active = false;
                            }
                            break;
                        case 'Đã giao hàng':
                            if (step.status === 'Đã giao hàng') {
                                step.date = now.toISOString();
                                step.completed = true;
                                step.active = true;
                            } else if (step.status === 'Đơn hàng đã đặt' || step.status === 'Đang xử lý' || step.status === 'Đang giao hàng') {
                                step.completed = true;
                                step.active = false;
                                if (!step.date) step.date = now.toISOString();
                            } else {
                                step.completed = false;
                                step.active = false;
                            }
                            break;
                    }
                });

                // Cập nhật đơn hàng trong client orders
                const clientOrder = clientOrders.find(o => o.orderId === orderId);
                if (clientOrder) {
                    clientOrder.status = newStatus;
                    clientOrder.timeline = [...order.timeline]; // Tạo bản sao của timeline
                    localStorage.setItem('orders', JSON.stringify(clientOrders));
                }

                // Lưu vào localStorage
                localStorage.setItem('adminOrders', JSON.stringify(orders));
                
                // Đóng modal và cập nhật giao diện
                closeModal();
                loadOrders();
            }
        }

        // Thêm hàm để xác định thứ tự của trạng thái
        function getStatusOrder(status) {
            const statusOrder = {
                'Đang xử lý': 1,
                'Đang giao hàng': 2,
                'Đã giao hàng': 3
            };
            return statusOrder[status] || 0;
        }

        // Đóng modal
        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        // Hàm format giá tiền
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(price);
        }

        // Hàm lấy class cho trạng thái đơn hàng
        function getStatusClass(status) {
            switch (status.toLowerCase()) {
                case 'đang xử lý':
                    return 'processing';
                case 'đang giao hàng':
                    return 'shipping';
                case 'đã giao hàng':
                    return 'delivered';
                case 'đã hủy':
                    return 'cancelled';
                default:
                    return 'processing';
            }
        }

        // Đóng modal khi click bên ngoài
        window.addEventListener('click', function(e) {
            const modal = document.getElementById('orderModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Hàm xử lý tìm kiếm khi nhấn Enter
        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchOrders();
            }
        }

        // Hàm tìm kiếm đơn hàng
        function searchOrders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            const tableBody = document.getElementById('ordersTableBody');
            
            if (!searchTerm) {
                loadOrders(); // Nếu không có từ khóa tìm kiếm, hiển thị tất cả
                return;
            }

            const filteredOrders = orders.filter(order => {
                const orderIdMatch = order.orderId.toLowerCase().includes(searchTerm);
                const customerNameMatch = order.customerInfo.fullname.toLowerCase().includes(searchTerm);
                return orderIdMatch || customerNameMatch;
            });

            if (filteredOrders.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="no-results">
                            <i class="fas fa-search" style="margin-right: 10px;"></i>
                            Không tìm thấy đơn hàng phù hợp
                        </td>
                    </tr>
                `;
                return;
            }

            // Hiển thị kết quả tìm kiếm
            tableBody.innerHTML = filteredOrders.map(order => {
                const orderDate = new Date(order.orderDate).toLocaleDateString('vi-VN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <tr>
                        <td>#${order.orderId}</td>
                        <td>${order.customerInfo.fullname}</td>
                        <td>${orderDate}</td>
                        <td>${formatPrice(order.total)}</td>
                        <td>
                            <span class="order-status status-${getStatusClass(order.status)}">
                                ${order.status}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="view-btn" onclick="viewOrderDetails('${order.orderId}')">
                                    <i class="fas fa-eye"></i> Chi tiết
                                </button>
                                <button class="update-btn" onclick="updateOrderStatus('${order.orderId}')">
                                    <i class="fas fa-edit"></i> Cập nhật
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Hàm xóa tìm kiếm
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            loadOrders(); // Tải lại tất cả đơn hàng
        }
    </script>
</body>
</html>
