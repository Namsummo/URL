<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Fashion Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/middleware.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50, #1a252f);
            color: #fff;
            position: fixed;
            height: 100vh;
            transition: all 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.1);
        }

        .sidebar-header h2 {
            color: #fff;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-menu {
            padding: 30px 0;
        }

        .nav-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            color: #c2c7d0;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 5px 0;
            border-left: 4px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-left: 4px solid #ff6b6b;
            transform: translateX(5px);
        }

        .nav-item i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
            font-size: 1.1em;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 30px;
        }

        .top-bar {
            background: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff6b6b;
            padding: 2px;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .products-header h2 {
            font-size: 1.8em;
            color: #333;
            font-weight: 600;
        }

        .add-product-btn {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .add-product-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        /* Table Styles */
        .products-table {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table th, .table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .product-image-small {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 500;
            display: inline-block;
        }

        .status-active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-inactive {
            background: #ffebee;
            color: #c62828;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .edit-btn {
            background: #4CAF50;
            color: white;
        }

        .edit-btn:hover {
            background: #43A047;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background: #E53935;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.5em;
            color: #333;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            display: none;
        }

        .form-group .file-upload-label {
            display: block;
            padding: 12px;
            background: #fff;
            border: 2px dashed #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .form-group .file-upload-label:hover {
            border-color: #ff6b6b;
            background: #fff5f5;
        }

        .form-group .file-upload-label i {
            font-size: 24px;
            color: #ff6b6b;
            margin-bottom: 8px;
        }

        .form-group .file-name {
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #ddd;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn, .save-btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .cancel-btn {
            background: #f8f9fa;
            border: 1px solid #ddd;
            color: #666;
        }

        .save-btn {
            background: #ff6b6b;
            border: none;
            color: white;
        }

        .save-btn:hover {
            background: #ff5252;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .sidebar-header h2, .nav-item span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
            }

            .products-table {
                overflow-x: auto;
            }
        }

        /* Thêm CSS cho checkbox */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .featured-badge {
            background: #ffd700;
            color: #856404;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .featured-badge i {
            font-size: 0.9em;
        }

        .variants-btn {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .variants-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Fashion Store</h2>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="categories.html" class="nav-item">
                    <i class="fas fa-tags"></i>
                    <span>Quản lý danh mục</span>
                </a>
                <a href="products.html" class="nav-item active">
                    <i class="fas fa-box"></i>
                    <span>Quản lý sản phẩm</span>
                </a>
                <a href="orders.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Quản lý đơn hàng</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Quản lý tài khoản</span>
                </a>
                <a href="promotions.html" class="nav-item">
                    <i class="fas fa-percent"></i>
                    <span>Khuyến mãi</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Báo cáo, phản hồi</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Cài đặt</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="Admin">
                    <span>Administrator</span>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Đăng xuất
                </button>
            </div>

            <div class="products-header">
                <h2>Quản lý sản phẩm</h2>
                <button class="add-product-btn" onclick="openAddModal()">
                    <i class="fas fa-plus"></i>
                    Thêm sản phẩm
                </button>
            </div>

            <div class="products-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Hình ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Ngày tạo</th>
                            <th>Nổi bật</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Products will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm sản phẩm mới</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Tên sản phẩm</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productCategory">Danh mục</label>
                    <select id="productCategory" required>
                        <!-- Categories will be loaded here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="productDescription">Mô tả sản phẩm</label>
                    <textarea id="productDescription" required placeholder="Nhập mô tả chi tiết về sản phẩm (chất liệu, kích thước, màu sắc,...)"></textarea>
                </div>
                <div class="form-group">
                    <label for="productImage">Hình ảnh sản phẩm</label>
                    <label for="productImage" class="file-upload-label">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <div>Kéo thả hoặc click để chọn ảnh</div>
                        <div class="file-name"></div>
                    </label>
                    <input type="file" id="productImage" accept="image/*" required>
                    <img id="imagePreview" class="image-preview" style="display: none;">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isFeatured">
                        <span>Sản phẩm nổi bật</span>
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="save-btn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Kiểm tra quyền admin
        document.addEventListener('DOMContentLoaded', function() {
            const adminUser = JSON.parse(localStorage.getItem('adminUser'));
            if (!adminUser || adminUser.role !== 'admin') {
                window.location.href = '../client/auth.html';
                return;
            }

            // Cập nhật thông tin admin
            const adminName = document.querySelector('.user-info span');
            if (adminName) {
                adminName.textContent = adminUser.name;
            }

            // Load sản phẩm và danh mục
            loadProducts();
            loadCategories();

            // Xử lý preview hình ảnh và hiển thị tên file
            const imageInput = document.getElementById('productImage');
            const imagePreview = document.getElementById('imagePreview');
            const fileName = document.querySelector('.file-name');
            
            imageInput.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    fileName.textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                } else {
                    fileName.textContent = '';
                    imagePreview.style.display = 'none';
                }
            });
        });

        // Xử lý đăng xuất
        function logout() {
            localStorage.removeItem('adminUser');
            window.location.href = '../client/auth.html';
        }

        // Load danh sách sản phẩm
        function loadProducts() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const categories = JSON.parse(localStorage.getItem('categories')) || [];
            const tableBody = document.getElementById('productsTableBody');
            
            tableBody.innerHTML = products.map(product => {
                const category = categories.find(c => c.id === product.categoryId);
                const createdAt = product.createdAt ? new Date(product.createdAt).toLocaleDateString('vi-VN') : '';
                return `
                    <tr>
                        <td>
                            <img src="${product.image}" alt="${product.name}" class="product-image-small">
                        </td>
                        <td>${product.name}</td>
                        <td>${category ? category.name : 'Không có'}</td>
                        <td>${createdAt}</td>
                        <td>
                            ${product.isFeatured ? 
                                '<span class="featured-badge"><i class="fas fa-star"></i> Nổi bật</span>' : 
                                '<span class="status-badge status-inactive">Bình thường</span>'
                            }
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="variants-btn" onclick="window.location.href='products-variants.html?id=${product.id}'">
                                    <i class="fas fa-palette"></i> Biến thể
                                </button>
                                <button class="edit-btn" onclick="editProduct(${product.id})">
                                    <i class="fas fa-edit"></i> Sửa
                                </button>
                                <button class="delete-btn" onclick="deleteProduct(${product.id})">
                                    <i class="fas fa-trash"></i> Xóa
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Load danh mục cho select
        function loadCategories() {
            const categories = JSON.parse(localStorage.getItem('categories')) || [];
            const categorySelect = document.getElementById('productCategory');
            
            categorySelect.innerHTML = categories
                .filter(category => category.isActive)
                .map(category => `
                    <option value="${category.id}">${category.name}</option>
                `).join('');
        }

        // Mở modal thêm sản phẩm
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Thêm sản phẩm mới';
            document.getElementById('productForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
            document.querySelector('.file-name').textContent = '';
            document.getElementById('productImage').setAttribute('required', '');
            document.getElementById('productForm').dataset.mode = 'add';
            document.getElementById('productModal').style.display = 'flex';
        }

        // Mở modal sửa sản phẩm
        function editProduct(id) {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const product = products.find(p => p.id === id);
            
            if (product) {
                document.getElementById('modalTitle').textContent = 'Sửa sản phẩm';
                document.getElementById('productName').value = product.name;
                document.getElementById('productCategory').value = product.categoryId;
                document.getElementById('productDescription').value = product.description;
                document.getElementById('isFeatured').checked = product.isFeatured || false;
                
                // Hiển thị preview ảnh hiện tại
                const imagePreview = document.getElementById('imagePreview');
                imagePreview.src = product.image;
                imagePreview.style.display = 'block';
                
                // Reset file input
                document.getElementById('productImage').value = '';
                // Hiển thị tên file là ảnh hiện tại
                document.querySelector('.file-name').textContent = 'Ảnh hiện tại';
                // Đánh dấu input file là không bắt buộc khi edit
                document.getElementById('productImage').removeAttribute('required');

                document.getElementById('productForm').dataset.mode = 'edit';
                document.getElementById('productForm').dataset.id = id;
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        // Xóa sản phẩm
        function deleteProduct(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                const products = JSON.parse(localStorage.getItem('products')) || [];
                const updatedProducts = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(updatedProducts));
                loadProducts();
            }
        }

        // Đóng modal
        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // Xử lý form thêm/sửa sản phẩm
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const form = this;
                const imageFile = document.getElementById('productImage').files[0];
                
                // Kiểm tra ảnh khi thêm mới
                if (!imageFile && form.dataset.mode === 'add') {
                    alert('Vui lòng chọn hình ảnh sản phẩm');
                    return;
                }

                // Lấy dữ liệu form
                const formData = {
                    name: document.getElementById('productName').value,
                    categoryId: parseInt(document.getElementById('productCategory').value),
                    description: document.getElementById('productDescription').value,
                    isFeatured: document.getElementById('isFeatured').checked
                };

                // Thêm ngày tạo khi thêm mới
                if (form.dataset.mode === 'add') {
                    formData.createdAt = new Date().toISOString();
                }

                // Xử lý ảnh
                if (imageFile) {
                    formData.image = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(imageFile);
                    });
                } else if (form.dataset.mode === 'edit') {
                    formData.image = document.getElementById('imagePreview').src;
                }

                // Lưu vào localStorage
                let products = JSON.parse(localStorage.getItem('products')) || [];
                
                if (form.dataset.mode === 'add') {
                    formData.id = Date.now();
                    products.push(formData);
                } else {
                    const id = parseInt(form.dataset.id);
                    products = products.map(p => 
                        p.id === id ? { ...p, ...formData } : p
                    );
                }
                
                localStorage.setItem('products', JSON.stringify(products));
                closeModal();
                loadProducts();

            } catch (error) {
                console.error('Lỗi khi lưu sản phẩm:', error);
                alert('Có lỗi xảy ra khi lưu sản phẩm. Vui lòng thử lại!');
            }
        });

        // Đóng modal khi click bên ngoài
        window.addEventListener('click', function(e) {
            const modal = document.getElementById('productModal');
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
